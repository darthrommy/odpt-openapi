openapi: 3.1.0
info:
  title: ODPT API（非公式定義）：共通（曜日・日付区分、事業者）
  version: 4.16.0
  license:
    name: CC0 1.0 Universal
    identifier: CC0-1.0
  description: |-
    公共交通オープンデータセンター（ODPT）のAPIについて、公開されているAPI仕様書（第4.16版）をもとに第三者が作成した非公式のOpenAPI定義です。
    ODPTおよび公共交通オープンデータ協議会が提供・保証するものではありません。正確な仕様は公式の仕様書で確認してください。

    ## 検索結果の形式
    検索系のAPIは、条件に一致したデータをJSON-LDのオブジェクトの配列で返します。一致するデータがなければ空の配列を返します。
    件数がシステムの上限を超えると、上限以下に切り詰めた結果が返るため、条件を追加して取り直してください。
    上限は多くのクラスで1,000件、`odpt:BusstopPole` で10,000件でした（2026年9月29日に確認）。

    ## 値がない場合
    任意のプロパティは、値がないときにプロパティ自体が省かれる場合と、`null` が入る場合があります。このため、任意のプロパティはすべて `null` も許す定義にしています。

    ## 絞り込み条件の指定
    各パスに列挙したクエリパラメータのほかに、そのクラスのプロパティ名をクエリパラメータに使って絞り込めます。
    - 値が文字列か数値のプロパティは、プロパティ名をそのまま指定します（例：`dc:title=東京`）。
    - 値が文字列か数値の配列のプロパティは、指定した値を要素に含むデータが一致します。
    - 値がオブジェクトのプロパティは、`プロパティ名.キー` の形でキーを指定します（例：`odpt:stationTitle.en=Tokyo`）。`キーA.キーB` のように入れ子にもできます。
    - 要素がオブジェクトの配列のプロパティは、条件に使えません。

    値をコンマで区切ると、いずれかに一致するデータを返します（例：`dc:title=東京,五反田`）。区切って指定できる値の数には上限があり、超えるとエラーになります。
    パラメータの値はURLエンコードして送信してください。

    ## エンドポイント
    データセットによってはエンドポイントが `https://api.odpt.org/api/v4` と異なります。利用するデータセットの案内を確認してください。

    全体の定義は openapi.yaml にあります。
servers:
  - url: https://api.odpt.org/api/v4
    description: 通常のAPI。
  - url: https://api-challenge.odpt.org/api/v4
    description: 公共交通オープンデータチャレンジの参加者向けAPI。参加者に発行されるキーでだけ利用でき、提供されるデータも通常のAPIと異なる。
security:
  - consumerKey: []
tags:
  - name: 共通
    description: 曜日・日付区分と事業者。
  - name: データダンプ
    description: 指定したクラスの全データを返します。レスポンスはダンプファイルのURLへの302リダイレクトです（仕様書では301）。
paths:
  /odpt:Calendar:
    get:
      operationId: searchCalendar
      tags:
        - 共通
      summary: 曜日・日付区分を検索
      parameters:
        - name: "@id"
          in: query
          description: データの `@id` で絞り込む。
          schema:
            type: string
        - name: owl:sameAs
          in: query
          description: データの `owl:sameAs` で絞り込む。
          schema:
            type: string
      responses:
        "200":
          description: 条件に一致したデータの配列。一致するデータがなければ空の配列。
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Calendar"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /odpt:Operator:
    get:
      operationId: searchOperator
      tags:
        - 共通
      summary: 事業者を検索
      parameters:
        - name: "@id"
          in: query
          description: データの `@id` で絞り込む。
          schema:
            type: string
        - name: owl:sameAs
          in: query
          description: データの `owl:sameAs` で絞り込む。
          schema:
            type: string
      responses:
        "200":
          description: 条件に一致したデータの配列。一致するデータがなければ空の配列。
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Operator"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /odpt:Calendar.json:
    get:
      operationId: dumpCalendar
      tags:
        - データダンプ
      summary: odpt:Calendar の全データを取得
      responses:
        "200":
          description: リダイレクト先から取得した全データ。
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Calendar"
        "302":
          description: ダンプファイルのURLへのリダイレクト。
          headers:
            Location:
              description: ダンプファイルのURL。
              schema:
                type: string
                format: uri
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /odpt:Operator.json:
    get:
      operationId: dumpOperator
      tags:
        - データダンプ
      summary: odpt:Operator の全データを取得
      responses:
        "200":
          description: リダイレクト先から取得した全データ。
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Operator"
        "302":
          description: ダンプファイルのURLへのリダイレクト。
          headers:
            Location:
              description: ダンプファイルのURL。
              schema:
                type: string
                format: uri
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
components:
  securitySchemes:
    consumerKey:
      type: apiKey
      in: query
      name: acl:consumerKey
      description: ODPT開発者サイトで発行されるアクセストークン。
  schemas:
    MultilingualText:
      type: object
      description: 言語タグ（`ja`、`en`、`ja-Hrkt` など）をキー、その言語の表記を値とするオブジェクト。
      additionalProperties:
        type: string
      example:
        ja: 東京
        en: Tokyo
    Calendar:
      type: object
      required:
        - "@context"
        - "@id"
        - "@type"
        - owl:sameAs
      properties:
        "@context":
          type: string
          description: JSON-LDのコンテキストを定義したファイルのURL。
          example: http://vocab.odpt.org/context_odpt.jsonld
        "@id":
          type: string
          description: このデータを一意に識別するucode。
          example: urn:ucode:_00001C000000000000010000030FD7E5
        "@type":
          type: string
          description: データのクラス。常に `odpt:Calendar`。
          example: odpt:Calendar
          const: odpt:Calendar
        dc:date:
          type:
            - string
            - "null"
          format: date-time
          description: このデータを生成した日時（ISO 8601）。
          example: 2017-01-13T15:10:00+09:00
        owl:sameAs:
          type: string
          description: このデータのID。`odpt.Calendar:名称` の形で、期間があれば `.期間` が続く。
          example: odpt.Calendar:Weekday
        dc:title:
          type:
            - string
            - "null"
          description: 日本語の曜日・日付区分名（平日、休日、市場休日など）。
          example: 平日
        odpt:calendarTitle:
          anyOf:
            - $ref: "#/components/schemas/MultilingualText"
            - type: "null"
          description: 曜日・日付区分名の多言語表記。
          example:
            ja: 平日
            en: Weekday
        odpt:day:
          type:
            - array
            - "null"
          items:
            type: string
            format: date
          description: この区分に当てはまる日付の一覧（ISO 8601の日付）。
          example:
            - 2017-01-13
            - 2017-01-18
        odpt:duration:
          type:
            - string
            - "null"
          description: この区分が有効な期間（ISO 8601の期間）。
          example: 2017-11-13/2017-11-18
        odpt:operator:
          type:
            - string
            - "null"
          x-odpt-ref: odpt:Operator
          description: この曜日・日付区分を定めた事業者のID（`odpt:Operator` の `owl:sameAs`）。
    Operator:
      type: object
      required:
        - "@context"
        - "@id"
        - "@type"
        - owl:sameAs
      properties:
        "@context":
          type: string
          description: JSON-LDのコンテキストを定義したファイルのURL。
          example: http://vocab.odpt.org/context_odpt.jsonld
        "@id":
          type: string
          description: このデータを一意に識別するucode。
          example: urn:ucode:_00001C000000000000010000030FD7E5
        "@type":
          type: string
          description: データのクラス。常に `odpt:Operator`。
          example: odpt:Operator
          const: odpt:Operator
        dc:date:
          type:
            - string
            - "null"
          format: date-time
          description: このデータを生成した日時（ISO 8601）。
          example: 2017-01-13T15:10:00+09:00
        owl:sameAs:
          type: string
          description: このデータのID。`odpt.Operator:名称` の形。
          example: odpt.Operator:XX
        dc:title:
          type:
            - string
            - "null"
          description: 日本語の事業者名。
          example: ○○電鉄
        odpt:operatorTitle:
          anyOf:
            - $ref: "#/components/schemas/MultilingualText"
            - type: "null"
          description: 事業者名の多言語表記。
          example:
            ja: ○○電鉄
            en: XX Railway
  responses:
    BadRequest:
      description: パラメータが正しくありません。
    Unauthorized:
      description: "`acl:consumerKey` が正しくありません。仕様書ではこの場合は401とされていますが、実際のAPIは403を返します（2026年9月29日に確認）。"
    Forbidden:
      description: "`acl:consumerKey` がないか正しくない、またはこのデータを取得する権限がありません。"
    NotFound:
      description: 該当するデータがありません。
    MethodNotAllowed:
      description: このHTTPメソッドは使えません。
    InternalServerError:
      description: サーバー内部でエラーが発生しました。
    ServiceUnavailable:
      description: サービスを利用できません。
