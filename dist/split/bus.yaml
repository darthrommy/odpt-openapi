          schema:
            type: string
        - name: odpt:operator
          in: query
          description: 事業者のID（`odpt:Operator` の `owl:sameAs`）で絞り込む。
          schema:
            type: string
            x-odpt-ref: odpt:Operator
        - name: odpt:busroute
          in: query
          description: 路線のIDで絞り込む。
          schema:
            type: string
      responses:
        "200":
          description: 条件に一致したデータの配列。一致するデータがなければ空の配列。
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BusroutePattern"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /odpt:BusroutePatternFare:
    get:
      operationId: searchBusroutePatternFare
      tags:
        - バス
      summary: バスの運賃を検索
      parameters:
        - name: "@id"
          in: query
          description: データの `@id` で絞り込む。
          schema:
            type: string
        - name: owl:sameAs
          in: query
          description: データの `owl:sameAs` で絞り込む。
          schema:
            type: string
        - name: odpt:operator
          in: query
          description: 事業者のID（`odpt:Operator` の `owl:sameAs`）で絞り込む。
          schema:
            type: string
            x-odpt-ref: odpt:Operator
        - name: odpt:fromBusstopPole
          in: query
          description: 乗車するバス停標柱のID（`odpt:BusstopPole` の `owl:sameAs`）で絞り込む。
          schema:
            type: string
            x-odpt-ref: odpt:BusstopPole
        - name: odpt:toBusstopPole
          in: query
          description: 降車するバス停標柱のID（`odpt:BusstopPole` の `owl:sameAs`）で絞り込む。
          schema:
            type: string
            x-odpt-ref: odpt:BusstopPole
        - name: odpt:ticketFare
          in: query
          description: 切符で乗車するときの大人運賃。
          schema:
            type: integer
        - name: odpt:childTicketFare
          in: query
          description: 切符で乗車するときの子供運賃。
          schema:
            type: integer
        - name: odpt:icCardFare
          in: query
          description: ICカードで乗車するときの大人運賃。
          schema:
            type: integer
        - name: odpt:childIcCardFare
          in: query
          description: ICカードで乗車するときの子供運賃。
          schema:
            type: integer
      responses:
        "200":
          description: 条件に一致したデータの配列。一致するデータがなければ空の配列。
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BusroutePatternFare"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /odpt:BusstopPole:
    get:
      operationId: searchBusstopPole
      tags:
        - バス
      summary: バス停標柱を検索
      parameters:
        - name: "@id"
          in: query
          description: データの `@id` で絞り込む。
          schema:
            type: string
        - name: owl:sameAs
          in: query
          description: データの `owl:sameAs` で絞り込む。
          schema:
            type: string
        - name: dc:title
          in: query
          description: バス停名で絞り込む。
          schema:
            type: string
        - name: odpt:busstopPoleNumber
          in: query
          description: 標柱番号で絞り込む。
          schema:
            type: string
        - name: odpt:platformNumber
          in: query
          description: のりば番号。
          schema:
            type: string
        - name: odpt:busroutePattern
          in: query
          description: この標柱に停まる系統のID（`odpt:BusroutePattern` の `owl:sameAs`）で絞り込む。
          schema:
            type: string
            x-odpt-ref: odpt:BusroutePattern
        - name: odpt:operator
          in: query
          description: 事業者のID（`odpt:Operator` の `owl:sameAs`）で絞り込む。
          schema:
            type: string
            x-odpt-ref: odpt:Operator
      responses:
        "200":
          description: 条件に一致したデータの配列。一致するデータがなければ空の配列。
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BusstopPole"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /odpt:BusstopPoleTimetable:
    get:
      operationId: searchBusstopPoleTimetable
      tags:
        - バス
      summary: バス停標柱の時刻表を検索
      parameters:
        - name: "@id"
          in: query
          description: データの `@id` で絞り込む。
          schema:
            type: string
        - name: owl:sameAs
          in: query
          description: データの `owl:sameAs` で絞り込む。
          schema:
            type: string
        - name: odpt:busstopPole
          in: query
          description: バス停標柱のID（`odpt:BusstopPole` の `owl:sameAs`）で絞り込む。
          schema:
            type: string
            x-odpt-ref: odpt:BusstopPole
        - name: odpt:busDirection
          in: query
          description: 方面のIDで絞り込む。
          schema:
            type: string
        - name: odpt:busroute
          in: query
          description: 路線のIDで絞り込む。
          schema:
            type: string
        - name: odpt:operator
          in: query
          description: 事業者のID（`odpt:Operator` の `owl:sameAs`）で絞り込む。
          schema:
            type: string
            x-odpt-ref: odpt:Operator
        - name: odpt:calendar
          in: query
          description: 適用される曜日・日付区分のID（`odpt:Calendar` の `owl:sameAs`）。
          schema:
            type: string
            x-odpt-ref: odpt:Calendar
        - name: dc:date
          in: query
          description: データの生成日で絞り込む。
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: 条件に一致したデータの配列。一致するデータがなければ空の配列。
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BusstopPoleTimetable"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /odpt:BusTimetable.json:
    get:
      operationId: dumpBusTimetable
      tags:
        - データダンプ
      summary: odpt:BusTimetable の全データを取得
      responses:
        "200":
          description: リダイレクト先から取得した全データ。
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BusTimetable"
        "302":
          description: ダンプファイルのURLへのリダイレクト。
          headers:
            Location:
              description: ダンプファイルのURL。
              schema:
                type: string
                format: uri
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /odpt:BusroutePattern.json:
    get:
      operationId: dumpBusroutePattern
      tags:
        - データダンプ
      summary: odpt:BusroutePattern の全データを取得
      responses:
