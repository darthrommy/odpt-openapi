openapi: 3.1.0
info:
  title: ODPT API（非公式定義）：バス
  version: 4.16.0
  license:
    name: CC0 1.0 Universal
    identifier: CC0-1.0
  description: |-
    公共交通オープンデータセンター（ODPT）のAPIについて、公開されているAPI仕様書（第4.16版）をもとに第三者が作成した非公式のOpenAPI定義です。
    ODPTおよび公共交通オープンデータ協議会が提供・保証するものではありません。正確な仕様は公式の仕様書で確認してください。

    ## 検索結果の形式
    検索系のAPIは、条件に一致したデータをJSON-LDのオブジェクトの配列で返します。一致するデータがなければ空の配列を返します。
    件数がシステムの上限を超えると、上限以下に切り詰めた結果が返るため、条件を追加して取り直してください。
    上限は多くのクラスで1,000件、`odpt:BusstopPole` で10,000件でした（2026年9月29日に確認）。

    ## 値がない場合
    任意のプロパティは、値がないときにプロパティ自体が省かれる場合と、`null` が入る場合があります。このため、任意のプロパティはすべて `null` も許す定義にしています。

    ## 絞り込み条件の指定
    各パスに列挙したクエリパラメータのほかに、そのクラスのプロパティ名をクエリパラメータに使って絞り込めます。
    - 値が文字列か数値のプロパティは、プロパティ名をそのまま指定します（例：`dc:title=東京`）。
    - 値が文字列か数値の配列のプロパティは、指定した値を要素に含むデータが一致します。
    - 値がオブジェクトのプロパティは、`プロパティ名.キー` の形でキーを指定します（例：`odpt:stationTitle.en=Tokyo`）。`キーA.キーB` のように入れ子にもできます。
    - 要素がオブジェクトの配列のプロパティは、条件に使えません。

    値をコンマで区切ると、いずれかに一致するデータを返します（例：`dc:title=東京,五反田`）。区切って指定できる値の数には上限があり、超えるとエラーになります。
    パラメータの値はURLエンコードして送信してください。

    ## エンドポイント
    データセットによってはエンドポイントが `https://api.odpt.org/api/v4` と異なります。利用するデータセットの案内を確認してください。

    全体の定義は openapi.yaml にあります。
servers:
  - url: https://api.odpt.org/api/v4
    description: 通常のAPI。
  - url: https://api-challenge.odpt.org/api/v4
    description: 公共交通オープンデータチャレンジの参加者向けAPI。参加者に発行されるキーでだけ利用でき、提供されるデータも通常のAPIと異なる。
security:
  - consumerKey: []
tags:
  - name: バス
    description: 系統、バス停、時刻表、運賃、バスの位置など。
  - name: データダンプ
    description: 指定したクラスの全データを返します。レスポンスはダンプファイルのURLへの302リダイレクトです（仕様書では301）。
  - name: 地物検索
    description: 緯度・経度と半径で指定した円の範囲にあるデータを返します。
paths:
  /odpt:Bus:
    get:
      operationId: searchBus
      tags:
        - バス
      summary: 走行中のバスの位置を検索
      parameters:
        - name: "@id"
          in: query
          description: データの `@id` で絞り込む。
          schema:
            type: string
        - name: owl:sameAs
          in: query
          description: データの `owl:sameAs` で絞り込む。
          schema:
            type: string
        - name: odpt:busroutePattern
          in: query
          description: バスが運行している系統のID（`odpt:BusroutePattern` の `owl:sameAs`）で絞り込む。
          schema:
            type: string
            x-odpt-ref: odpt:BusroutePattern
        - name: odpt:operator
          in: query
          description: 事業者のID（`odpt:Operator` の `owl:sameAs`）で絞り込む。
          schema:
            type: string
            x-odpt-ref: odpt:Operator
        - name: odpt:fromBusstopPole
          in: query
          description: バスが停車中のバス停、または最後に通過したバス停のID（`odpt:BusstopPole` の `owl:sameAs`）で絞り込む。
          schema:
            type: string
            x-odpt-ref: odpt:BusstopPole
        - name: odpt:toBusstopPole
          in: query
          description: バスが次に着くバス停のID（`odpt:BusstopPole` の `owl:sameAs`）で絞り込む。
          schema:
            type: string
            x-odpt-ref: odpt:BusstopPole
      responses:
        "200":
          description: 条件に一致したデータの配列。一致するデータがなければ空の配列。
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Bus"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /odpt:BusTimetable:
    get:
      operationId: searchBusTimetable
      tags:
        - バス
      summary: バス時刻表を検索
      parameters:
        - name: "@id"
          in: query
          description: データの `@id` で絞り込む。
          schema:
            type: string
        - name: owl:sameAs
          in: query
          description: データの `owl:sameAs` で絞り込む。
          schema:
            type: string
        - name: odpt:operator
          in: query
          required: true
          description: 事業者のID（`odpt:Operator` の `owl:sameAs`）で絞り込む。
          schema:
            type: string
            x-odpt-ref: odpt:Operator
        - name: odpt:busroutePattern
          in: query
          description: 系統のID（`odpt:BusroutePattern` の `owl:sameAs`）で絞り込む。
          schema:
            type: string
            x-odpt-ref: odpt:BusroutePattern
        - name: dc:title
          in: query
          description: 系統名などのバス路線名で絞り込む。
          schema:
            type: string
        - name: odpt:calendar
          in: query
          description: 適用される曜日・日付区分のID（`odpt:Calendar` の `owl:sameAs`）。
          schema:
            type: string
            x-odpt-ref: odpt:Calendar
      responses:
        "200":
          description: 条件に一致したデータの配列。一致するデータがなければ空の配列。
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BusTimetable"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /odpt:BusroutePattern:
    get:
      operationId: searchBusroutePattern
      tags:
        - バス
      summary: バスの系統を検索
      parameters:
        - name: "@id"
