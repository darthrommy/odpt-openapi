openapi: 3.1.0
info:
  title: ODPT API（非公式定義）：航空
  version: 4.16.0
  license:
    name: CC0 1.0 Universal
    identifier: CC0-1.0
  description: |-
    公共交通オープンデータセンター（ODPT）のAPIについて、公開されているAPI仕様書（第4.16版）をもとに第三者が作成した非公式のOpenAPI定義です。
    ODPTおよび公共交通オープンデータ協議会が提供・保証するものではありません。正確な仕様は公式の仕様書で確認してください。

    ## 検索結果の形式
    検索系のAPIは、条件に一致したデータをJSON-LDのオブジェクトの配列で返します。一致するデータがなければ空の配列を返します。
    件数がシステムの上限を超えると、上限以下に切り詰めた結果が返るため、条件を追加して取り直してください。
    上限は多くのクラスで1,000件、`odpt:BusstopPole` で10,000件でした（2026年9月29日に確認）。

    ## 値がない場合
    任意のプロパティは、値がないときにプロパティ自体が省かれる場合と、`null` が入る場合があります。このため、任意のプロパティはすべて `null` も許す定義にしています。

    ## 絞り込み条件の指定
    各パスに列挙したクエリパラメータのほかに、そのクラスのプロパティ名をクエリパラメータに使って絞り込めます。
    - 値が文字列か数値のプロパティは、プロパティ名をそのまま指定します（例：`dc:title=東京`）。
    - 値が文字列か数値の配列のプロパティは、指定した値を要素に含むデータが一致します。
    - 値がオブジェクトのプロパティは、`プロパティ名.キー` の形でキーを指定します（例：`odpt:stationTitle.en=Tokyo`）。`キーA.キーB` のように入れ子にもできます。
    - 要素がオブジェクトの配列のプロパティは、条件に使えません。

    値をコンマで区切ると、いずれかに一致するデータを返します（例：`dc:title=東京,五反田`）。区切って指定できる値の数には上限があり、超えるとエラーになります。
    パラメータの値はURLエンコードして送信してください。

    ## エンドポイント
    データセットによってはエンドポイントが `https://api.odpt.org/api/v4` と異なります。利用するデータセットの案内を確認してください。

    全体の定義は openapi.yaml にあります。
servers:
  - url: https://api.odpt.org/api/v4
    description: 通常のAPI。
  - url: https://api-challenge.odpt.org/api/v4
    description: 公共交通オープンデータチャレンジの参加者向けAPI。参加者に発行されるキーでだけ利用でき、提供されるデータも通常のAPIと異なる。
security:
  - consumerKey: []
tags:
  - name: 航空
    description: 空港、ターミナル、時刻表、発着便の情報など。
  - name: データダンプ
    description: 指定したクラスの全データを返します。レスポンスはダンプファイルのURLへの302リダイレクトです（仕様書では301）。
paths:
  /odpt:Airport:
    get:
      operationId: searchAirport
      tags:
        - 航空
      summary: 空港を検索
      parameters:
        - name: "@id"
          in: query
          description: データの `@id` で絞り込む。
          schema:
            type: string
        - name: owl:sameAs
          in: query
          description: データの `owl:sameAs` で絞り込む。
          schema:
            type: string
      responses:
        "200":
          description: 条件に一致したデータの配列。一致するデータがなければ空の配列。
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Airport"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /odpt:AirportTerminal:
    get:
      operationId: searchAirportTerminal
      tags:
        - 航空
      summary: 空港ターミナルを検索
      parameters:
        - name: "@id"
          in: query
          description: データの `@id` で絞り込む。
          schema:
            type: string
        - name: owl:sameAs
          in: query
          description: データの `owl:sameAs` で絞り込む。
          schema:
            type: string
        - name: odpt:airport
          in: query
          description: 空港のID（`odpt:Airport` の `owl:sameAs`）。
          schema:
            type: string
            x-odpt-ref: odpt:Airport
      responses:
        "200":
          description: 条件に一致したデータの配列。一致するデータがなければ空の配列。
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AirportTerminal"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /odpt:FlightInformationArrival:
    get:
      operationId: searchFlightInformationArrival
      tags:
        - 航空
      summary: 当日の到着便の最新情報を検索
      parameters:
        - name: owl:sameAs
          in: query
          description: データの `owl:sameAs` で絞り込む。
          schema:
            type: string
        - name: odpt:operator
          in: query
          description: 情報を提供している空港事業者または航空会社のID（`odpt:Operator` の `owl:sameAs`）で絞り込む。
          schema:
            type: string
            x-odpt-ref: odpt:Operator
        - name: odpt:airline
          in: query
          description: 運航する航空会社のID（`odpt:Operator` の `owl:sameAs`）で絞り込む。
          schema:
            type: string
            x-odpt-ref: odpt:Operator
        - name: odpt:flightStatus
          in: query
          description: 運航状況のID（`odpt:FlightStatus` の `owl:sameAs`）で絞り込む。
          schema:
            type: string
            x-odpt-ref: odpt:FlightStatus
        - name: odpt:arrivalAirport
          in: query
          description: 到着空港のID（`odpt:Airport` の `owl:sameAs`）。
          schema:
            type: string
            x-odpt-ref: odpt:Airport
        - name: odpt:arrivalAirportTerminal
          in: query
          description: 到着空港のターミナルのID（`odpt:AirportTerminal` の `owl:sameAs`）で絞り込む。
          schema:
            type: string
            x-odpt-ref: odpt:AirportTerminal
        - name: odpt:arrivalGate
          in: query
          description: 到着空港のゲート番号で絞り込む。
          schema:
            type: string
        - name: odpt:originAirport
          in: query
          description: 出発空港のID（`odpt:Airport` の `owl:sameAs`）。
          schema:
            type: string
            x-odpt-ref: odpt:Airport
      responses:
        "200":
          description: 条件に一致したデータの配列。一致するデータがなければ空の配列。
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FlightInformationArrival"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /odpt:FlightInformationDeparture:
    get:
      operationId: searchFlightInformationDeparture
      tags:
        - 航空
      summary: 当日の出発便の最新情報を検索
      parameters:
        - name: owl:sameAs
          in: query
          description: データの `owl:sameAs` で絞り込む。
          schema:
            type: string
        - name: odpt:operator
          in: query
          description: 情報を提供している空港事業者または航空会社のID（`odpt:Operator` の `owl:sameAs`）で絞り込む。
          schema:
            type: string
            x-odpt-ref: odpt:Operator
        - name: odpt:airline
          in: query
          description: 運航する航空会社のID（`odpt:Operator` の `owl:sameAs`）で絞り込む。
          schema:
            type: string
            x-odpt-ref: odpt:Operator
        - name: odpt:flightStatus
          in: query
          description: 運航状況のID（`odpt:FlightStatus` の `owl:sameAs`）で絞り込む。
          schema:
            type: string
            x-odpt-ref: odpt:FlightStatus
        - name: odpt:departureAirport
          in: query
          description: 出発空港のID（`odpt:Airport` の `owl:sameAs`）。
          schema:
            type: string
            x-odpt-ref: odpt:Airport
        - name: odpt:departureAirportTerminal
          in: query
          description: 出発空港のターミナルのID（`odpt:AirportTerminal` の `owl:sameAs`）で絞り込む。
          schema:
            type: string
            x-odpt-ref: odpt:AirportTerminal
        - name: odpt:departureGate
          in: query
          description: 出発空港のゲート番号で絞り込む。
          schema:
            type: string
        - name: odpt:destinationAirport
          in: query
          description: 到着地の空港のID（`odpt:Airport` の `owl:sameAs`）。
          schema:
            type: string
            x-odpt-ref: odpt:Airport
      responses:
        "200":
          description: 条件に一致したデータの配列。一致するデータがなければ空の配列。
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FlightInformationDeparture"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /odpt:FlightSchedule:
    get:
      operationId: searchFlightSchedule
      tags:
        - 航空
      summary: 空港を発着する便の予定時刻表を検索
      parameters:
        - name: "@id"
          in: query
          description: データの `@id` で絞り込む。
          schema:
            type: string
        - name: owl:sameAs
          in: query
          description: データの `owl:sameAs` で絞り込む。
          schema:
            type: string
        - name: odpt:operator
          in: query
          description: 情報を提供している空港事業者または航空会社のID（`odpt:Operator` の `owl:sameAs`）で絞り込む。
          schema:
            type: string
            x-odpt-ref: odpt:Operator
        - name: odpt:calendar
          in: query
          description: 曜日・日付区分のID（`odpt:Calendar` の `owl:sameAs`）で絞り込む。
          schema:
            type: string
            x-odpt-ref: odpt:Calendar
        - name: odpt:originAirport
          in: query
          description: 出発空港のID（`odpt:Airport` の `owl:sameAs`）。
          schema:
            type: string
            x-odpt-ref: odpt:Airport
        - name: odpt:destinationAirport
          in: query
          description: 到着地の空港のID（`odpt:Airport` の `owl:sameAs`）。
          schema:
            type: string
            x-odpt-ref: odpt:Airport
      responses:
        "200":
          description: 条件に一致したデータの配列。一致するデータがなければ空の配列。
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FlightSchedule"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /odpt:FlightStatus:
    get:
      operationId: searchFlightStatus
      tags:
        - 航空
      summary: 運航状況の種類を検索
      parameters:
        - name: "@id"
          in: query
          description: データの `@id` で絞り込む。
          schema:
            type: string
        - name: owl:sameAs
          in: query
          description: データの `owl:sameAs` で絞り込む。
          schema:
            type: string
      responses:
        "200":
          description: 条件に一致したデータの配列。一致するデータがなければ空の配列。
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FlightStatus"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /odpt:Airport.json:
    get:
      operationId: dumpAirport
      tags:
        - データダンプ
      summary: odpt:Airport の全データを取得
      responses:
        "200":
          description: リダイレクト先から取得した全データ。
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Airport"
        "302":
          description: ダンプファイルのURLへのリダイレクト。
          headers:
            Location:
              description: ダンプファイルのURL。
              schema:
                type: string
                format: uri
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /odpt:AirportTerminal.json:
    get:
      operationId: dumpAirportTerminal
      tags:
        - データダンプ
      summary: odpt:AirportTerminal の全データを取得
      responses:
        "200":
          description: リダイレクト先から取得した全データ。
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AirportTerminal"
        "302":
          description: ダンプファイルのURLへのリダイレクト。
          headers:
            Location:
              description: ダンプファイルのURL。
              schema:
                type: string
                format: uri
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /odpt:FlightSchedule.json:
    get:
      operationId: dumpFlightSchedule
      tags:
        - データダンプ
      summary: odpt:FlightSchedule の全データを取得
      responses:
        "200":
          description: リダイレクト先から取得した全データ。
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FlightSchedule"
        "302":
          description: ダンプファイルのURLへのリダイレクト。
          headers:
            Location:
              description: ダンプファイルのURL。
              schema:
                type: string
                format: uri
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /odpt:FlightStatus.json:
    get:
      operationId: dumpFlightStatus
      tags:
        - データダンプ
      summary: odpt:FlightStatus の全データを取得
      responses:
        "200":
          description: リダイレクト先から取得した全データ。
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FlightStatus"
        "302":
          description: ダンプファイルのURLへのリダイレクト。
          headers:
            Location:
              description: ダンプファイルのURL。
              schema:
                type: string
                format: uri
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
components:
  securitySchemes:
    consumerKey:
      type: apiKey
      in: query
      name: acl:consumerKey
      description: ODPT開発者サイトで発行されるアクセストークン。
  schemas:
    MultilingualText:
      type: object
      description: 言語タグ（`ja`、`en`、`ja-Hrkt` など）をキー、その言語の表記を値とするオブジェクト。
      additionalProperties:
        type: string
      example:
        ja: 東京
        en: Tokyo
    Time:
      type: string
      description: "`H:MM` または `HH:MM` 形式の時刻。バスの時刻表では時が1桁のことがある。"
      pattern: ^\d{1,2}:\d{2}$
      example: 05:09
    GeoJSON:
      type: object
      description: GeoJSON形式の地物情報。
      required:
        - type
      properties:
        type:
          type: string
        coordinates:
          type: array
      additionalProperties: true
    Airport:
      type: object
      required:
        - "@context"
        - "@id"
        - "@type"
        - owl:sameAs
      properties:
        "@context":
          type: string
          description: JSON-LDのコンテキストを定義したファイルのURL。
          example: http://vocab.odpt.org/context_odpt.jsonld
        "@id":
          type: string
          description: このデータを一意に識別するucode。
          example: urn:ucode:_00001C000000000000010000030FD7E5
        "@type":
          type: string
          description: データのクラス。常に `odpt:Airport`。
          example: odpt:Airport
          const: odpt:Airport
        dc:date:
          type:
            - string
            - "null"
          format: date-time
          description: このデータを生成した日時（ISO 8601）。
          example: 2017-01-13T15:10:00+09:00
        owl:sameAs:
          type: string
          description: このデータのID。`odpt.Airport:` にIATAの3文字の空港コードが続く形。
          example: odpt.Airport:HND
        dc:title:
          type:
            - string
            - "null"
          description: 日本語の空港名。所在地がわかり、ほかの空港と区別できる名前になっている。
          example: 東京(羽田)
        odpt:airportTitle:
          anyOf:
            - $ref: "#/components/schemas/MultilingualText"
            - type: "null"
          description: 空港名の多言語表記。
          example:
            ja: 東京(羽田)
            en: Tokyo (Haneda)
        odpt:airportTerminal:
          type:
            - array
            - "null"
          items:
            type: string
            x-odpt-ref: odpt:AirportTerminal
          description: この空港のターミナルのID（`odpt:AirportTerminal` の `owl:sameAs`）の一覧。
          example:
            - odpt.AirportTerminal:HND.DomesticTerminal1
        geo:long:
          type:
            - number
            - "null"
          description: 代表点の経度（WGS84、10進数）。
          example: 139.1234
        geo:lat:
          type:
            - number
            - "null"
          description: 代表点の緯度（WGS84、10進数）。
          example: 35.1234
        ug:region:
          anyOf:
            - $ref: "#/components/schemas/GeoJSON"
            - type: "null"
          description: 地物の形状（GeoJSON）。
    AirportTerminal:
      type: object
      required:
        - "@context"
        - "@id"
        - "@type"
        - owl:sameAs
        - odpt:airport
      properties:
        "@context":
          type: string
          description: JSON-LDのコンテキストを定義したファイルのURL。
          example: http://vocab.odpt.org/context_odpt.jsonld
        "@id":
          type: string
          description: このデータを一意に識別するucode。
          example: urn:ucode:_00001C000000000000010000030FD7E5
        "@type":
          type: string
          description: データのクラス。常に `odpt:AirportTerminal`。
          example: odpt:AirportTerminal
          const: odpt:AirportTerminal
        dc:date:
          type:
            - string
            - "null"
          format: date-time
          description: このデータを生成した日時（ISO 8601）。
          example: 2017-01-13T15:10:00+09:00
        owl:sameAs:
          type: string
          description: このデータのID。`odpt.AirportTerminal:IATA空港コード.ターミナル` の形。ターミナル内のウィングなどを表す場合は、さらに `.ウィング` などが続く。
          example: odpt.AirportTerminal:HND.DomesticTerminal1
        dc:title:
