          in: query
          description: データの `owl:sameAs` で絞り込む。
          schema:
            type: string
        - name: odpt:operator
          in: query
          description: 運行情報を提供している事業者のID（`odpt:Operator` の `owl:sameAs`）で絞り込む。
          schema:
            type: string
            x-odpt-ref: odpt:Operator
        - name: odpt:railway
          in: query
          description: 運行情報の対象路線のID（`odpt:Railway` の `owl:sameAs`）で絞り込む。
          schema:
            type: string
            x-odpt-ref: odpt:Railway
      responses:
        "200":
          description: 条件に一致したデータの配列。一致するデータがなければ空の配列。
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TrainInformation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
