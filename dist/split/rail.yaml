          schema:
            type: string
        - name: owl:sameAs
          in: query
          description: データの `owl:sameAs` で絞り込む。
          schema:
            type: string
        - name: odpt:operator
          in: query
          description: 事業者のID（`odpt:Operator` の `owl:sameAs`）で絞り込む。
          schema:
            type: string
            x-odpt-ref: odpt:Operator
        - name: odpt:fromStation
          in: query
          description: 出発駅のID（`odpt:Station` の `owl:sameAs`）。
          schema:
            type: string
            x-odpt-ref: odpt:Station
        - name: odpt:toStation
          in: query
          description: 到着駅のID（`odpt:Station` の `owl:sameAs`）。
          schema:
            type: string
            x-odpt-ref: odpt:Station
      responses:
        "200":
          description: 条件に一致したデータの配列。一致するデータがなければ空の配列。
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RailwayFare"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /odpt:Station:
    get:
      operationId: searchStation
      tags:
        - 鉄道
      summary: 駅を検索
      parameters:
        - name: "@id"
          in: query
          description: データの `@id` で絞り込む。
          schema:
            type: string
        - name: owl:sameAs
          in: query
          description: データの `owl:sameAs` で絞り込む。
          schema:
            type: string
        - name: dc:title
          in: query
          description: 日本語の駅名で絞り込む（例：新宿）。
          schema:
            type: string
        - name: odpt:operator
          in: query
          description: 事業者のID（`odpt:Operator` の `owl:sameAs`）で絞り込む。
          schema:
            type: string
            x-odpt-ref: odpt:Operator
        - name: odpt:railway
          in: query
          description: 駅がある路線のID（`odpt:Railway` の `owl:sameAs`）で絞り込む。
          schema:
            type: string
            x-odpt-ref: odpt:Railway
        - name: odpt:stationCode
          in: query
          description: 駅番号で絞り込む（例：`OH01`）。
          schema:
            type: string
      responses:
        "200":
          description: 条件に一致したデータの配列。一致するデータがなければ空の配列。
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Station"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /odpt:StationTimetable:
    get:
      operationId: searchStationTimetable
      tags:
        - 鉄道
      summary: 駅時刻表を検索
      parameters:
        - name: "@id"
          in: query
          description: データの `@id` で絞り込む。
          schema:
            type: string
        - name: owl:sameAs
          in: query
          description: データの `owl:sameAs` で絞り込む。
          schema:
            type: string
        - name: odpt:station
          in: query
          description: 駅のID（`odpt:Station` の `owl:sameAs`）で絞り込む。
          schema:
            type: string
            x-odpt-ref: odpt:Station
        - name: odpt:railway
          in: query
          description: 路線のID（`odpt:Railway` の `owl:sameAs`）で絞り込む。
          schema:
            type: string
            x-odpt-ref: odpt:Railway
        - name: odpt:operator
          in: query
          description: 事業者のID（`odpt:Operator` の `owl:sameAs`）で絞り込む。
          schema:
            type: string
            x-odpt-ref: odpt:Operator
        - name: odpt:railDirection
          in: query
          description: 進行方向のID（`odpt:RailDirection` の `owl:sameAs`）で絞り込む。
          schema:
            type: string
            x-odpt-ref: odpt:RailDirection
        - name: odpt:calendar
          in: query
          description: 曜日・日付区分のID（`odpt:Calendar` の `owl:sameAs`）で絞り込む。
          schema:
            type: string
            x-odpt-ref: odpt:Calendar
        - name: dc:date
          in: query
          description: 指定した日付に使われる時刻表に絞り込む。
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: 条件に一致したデータの配列。一致するデータがなければ空の配列。
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StationTimetable"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /odpt:Train:
    get:
      operationId: searchTrain
      tags:
        - 鉄道
      summary: 走行中の列車の位置を検索
      parameters:
        - name: owl:sameAs
          in: query
          description: データの `owl:sameAs` で絞り込む。
          schema:
            type: string
        - name: odpt:operator
          in: query
          description: 列車の位置情報を提供している事業者のID（`odpt:Operator` の `owl:sameAs`）で絞り込む。
          schema:
            type: string
            x-odpt-ref: odpt:Operator
        - name: odpt:railway
          in: query
          description: 列車が走っている路線のID（`odpt:Railway` の `owl:sameAs`）で絞り込む。
          schema:
            type: string
            x-odpt-ref: odpt:Railway
