  /places/odpt:Station:
    get:
      operationId: searchStationByLocation
      tags:
        - 地物検索
      summary: 指定した範囲にある odpt:Station を検索
      parameters:
        - name: lat
          in: query
          required: true
          description: 範囲の中心の緯度（WGS84、10進数）。
          schema:
            type: number
          example: 35.681265
        - name: lon
          in: query
          required: true
          description: 範囲の中心の経度（WGS84、10進数）。
          schema:
            type: number
          example: 139.766926
        - name: radius
          in: query
          required: true
          description: 範囲の半径（メートル）。
          schema:
            type: number
            minimum: 0
            maximum: 4000
          example: 1000
        - name: "@id"
          in: query
          description: データの `@id` で絞り込む。
          schema:
            type: string
        - name: owl:sameAs
          in: query
          description: データの `owl:sameAs` で絞り込む。
          schema:
            type: string
        - name: dc:title
          in: query
          description: 日本語の駅名で絞り込む（例：新宿）。
          schema:
            type: string
        - name: odpt:operator
          in: query
          description: 事業者のID（`odpt:Operator` の `owl:sameAs`）で絞り込む。
          schema:
            type: string
            x-odpt-ref: odpt:Operator
        - name: odpt:railway
          in: query
          description: 駅がある路線のID（`odpt:Railway` の `owl:sameAs`）で絞り込む。
          schema:
            type: string
            x-odpt-ref: odpt:Railway
        - name: odpt:stationCode
          in: query
          description: 駅番号で絞り込む（例：`OH01`）。
          schema:
            type: string
      responses:
        "200":
          description: 範囲内で条件に一致したデータの配列。一致するデータがなければ空の配列。
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Station"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
components:
  securitySchemes:
    consumerKey:
      type: apiKey
      in: query
      name: acl:consumerKey
      description: ODPT開発者サイトで発行されるアクセストークン。
  schemas:
    MultilingualText:
      type: object
      description: 言語タグ（`ja`、`en`、`ja-Hrkt` など）をキー、その言語の表記を値とするオブジェクト。
      additionalProperties:
        type: string
      example:
        ja: 東京
        en: Tokyo
    Time:
      type: string
      description: "`H:MM` または `HH:MM` 形式の時刻。バスの時刻表では時が1桁のことがある。"
      pattern: ^\d{1,2}:\d{2}$
      example: 05:09
    GeoJSON:
      type: object
      description: GeoJSON形式の地物情報。
      required:
        - type
      properties:
        type:
          type: string
        coordinates:
          type: array
      additionalProperties: true
    PassengerSurvey:
      type: object
      required:
        - "@context"
        - "@id"
        - "@type"
        - dc:date
        - owl:sameAs
        - odpt:operator
        - odpt:station
        - odpt:railway
        - odpt:includeAlighting
        - odpt:passengerSurveyObject
      properties:
        "@context":
          type: string
          description: JSON-LDのコンテキストを定義したファイルのURL。
          example: http://vocab.odpt.org/context_odpt.jsonld
        "@id":
          type: string
          description: このデータを一意に識別するucode。
          example: urn:ucode:_00001C000000000000010000030FD7E5
        "@type":
          type: string
          description: データのクラス。常に `odpt:PassengerSurvey`。
          example: odpt:PassengerSurvey
          const: odpt:PassengerSurvey
        dc:date:
          type: string
          format: date-time
          description: このデータを生成した日時（ISO 8601）。
          example: 2017-01-13T15:10:00+09:00
        owl:sameAs:
          type: string
          description: このデータのID。`odpt.PassengerSurvey:会社名.駅名` か `odpt.PassengerSurvey:会社名.路線名.駅名` の形。
          example: odpt.PassengerSurvey:JR-East.Tokyo
        odpt:operator:
          type: string
          x-odpt-ref: odpt:Operator
          description: 事業者のID（`odpt:Operator` の `owl:sameAs`）。
          example: odpt.Operator:JR-East
        odpt:station:
          type: array
          items:
            type: string
            x-odpt-ref: odpt:Station
          description: 対象の駅のID（`odpt:Station` の `owl:sameAs`）の一覧。
          example:
            - odpt.Station:JR-East.Yamanote.Tokyo
            - odpt.Station:JR-East.ChuoRapid.Tokyo
        odpt:railway:
          type: array
          items:
            type: string
            x-odpt-ref: odpt:Railway
          description: 対象の路線のID（`odpt:Railway` の `owl:sameAs`）の一覧。
          example:
            - odpt.Railway:JR-East.Yamanote
            - odpt.Railway:JR-East.ChuoRapid
        odpt:includeAlighting:
          type: boolean
          description: 人数が降車を含む乗降人員なら true、乗車人員だけなら false。
          example: true
        odpt:passengerSurveyObject:
          type: array
          items:
            $ref: "#/components/schemas/PassengerSurveyObject"
          description: 調査年度ごとの人数の一覧。
          example:
            - odpt:surveyYear: 2017
              odpt:passengerJourneys: 12345
    PassengerSurveyObject:
      type: object
      required:
        - odpt:surveyYear
        - odpt:passengerJourneys
      properties:
        odpt:surveyYear:
          type: integer
          description: 調査した年度。
          example: 2017
        odpt:passengerJourneys:
          type: integer
          description: 1日平均の乗降人員数。`odpt:includeAlighting` が false のときは乗車人員数。
          example: 12345
    RailDirection:
      type: object
      required:
        - "@context"
        - "@id"
        - "@type"
        - owl:sameAs
      properties:
        "@context":
          type: string
          description: JSON-LDのコンテキストを定義したファイルのURL。
          example: http://vocab.odpt.org/context_odpt.jsonld
        "@id":
          type: string
          description: このデータを一意に識別するucode。
          example: urn:ucode:_00001C000000000000010000030FD7E5
        "@type":
          type: string
          description: データのクラス。常に `odpt:RailDirection`。
          example: odpt:RailDirection
          const: odpt:RailDirection
        dc:date:
          type:
            - string
            - "null"
          format: date-time
          description: このデータを生成した日時（ISO 8601）。
          example: 2017-01-13T15:10:00+09:00
        owl:sameAs:
          type: string
          description: このデータのID。`odpt.RailDirection:進行方向` か `odpt.RailDirection:会社名.進行方向` の形。
          example: odpt.RailDirection:Inbound
        dc:title:
          type:
            - string
            - "null"
          description: 日本語の進行方向名。
          example: 上り
        odpt:railDirectionTitle:
          anyOf:
            - $ref: "#/components/schemas/MultilingualText"
            - type: "null"
          description: 進行方向名の多言語表記。
          example:
            ja: 上り
            en: Inbound
        odpt:operator:
          type:
            - string
            - "null"
          x-odpt-ref: odpt:Operator
          description: この進行方向を定めた事業者のID（`odpt:Operator` の `owl:sameAs`）。
    Railway:
      type: object
      required:
        - "@context"
        - "@id"
        - "@type"
        - dc:date
        - owl:sameAs
        - dc:title
        - odpt:operator
        - odpt:stationOrder
      properties:
        "@context":
          type: string
          description: JSON-LDのコンテキストを定義したファイルのURL。
          example: http://vocab.odpt.org/context_odpt.jsonld
        "@id":
          type: string
          description: このデータを一意に識別するucode。
          example: urn:ucode:_00001C000000000000010000030FD7E5
        "@type":
          type: string
          description: データのクラス。常に `odpt:Railway`。
          example: odpt:Railway
          const: odpt:Railway
        dc:date:
          type: string
          format: date-time
          description: このデータを生成した日時（ISO 8601）。
          example: 2017-01-13T15:10:00+09:00
        owl:sameAs:
          type: string
          description: このデータのID。`odpt.Railway:会社名.路線名` の形。
          example: odpt.Railway:JR-East.Yamanote
        dc:title:
          type: string
          description: 日本語の路線名。
          example: 山手線
        odpt:railwayTitle:
          anyOf:
            - $ref: "#/components/schemas/MultilingualText"
            - type: "null"
          description: 路線名の多言語表記。
          example:
            ja: 山手線
            en: Yamanote Line
        odpt:kana:
          type:
            - string
            - "null"
          description: 路線名の読み（ひらがな）。
        odpt:operator:
          type: string
          x-odpt-ref: odpt:Operator
          description: 事業者のID（`odpt:Operator` の `owl:sameAs`）。
          example: odpt.Operator:JR-East
        odpt:lineCode:
          type:
            - string
            - "null"
          description: 路線記号（丸ノ内線なら `M`）。
          example: M
        odpt:color:
          type:
            - string
            - "null"
          description: 路線の色。`#RRGGBB`（16進）、`DICnnn`（DIC）、`PANTONExxxx`（PANTONE）のいずれかの形式。
        ug:region:
          anyOf:
            - $ref: "#/components/schemas/GeoJSON"
            - type: "null"
          description: 地物の形状（GeoJSON）。
        odpt:ascendingRailDirection:
          type:
            - string
            - "null"
          x-odpt-ref: odpt:RailDirection
          description: "`odpt:stationOrder` の `odpt:index` が増える向きの進行方向のID（`odpt:RailDirection` の `owl:sameAs`）。"
          example: odpt.RailDirection:Outbound
        odpt:descendingRailDirection:
          type:
            - string
            - "null"
          x-odpt-ref: odpt:RailDirection
          description: "`odpt:stationOrder` の `odpt:index` が減る向きの進行方向のID（`odpt:RailDirection` の `owl:sameAs`）。"
          example: odpt.RailDirection:Inbound
        odpt:stationOrder:
          type: array
          items:
            $ref: "#/components/schemas/StationOrder"
          description: 路線上の駅を並び順に並べた一覧。
          example:
            - odpt:index: 1
              odpt:station: odpt.Station:JR-East.ChuoRapid.Tokyo
    StationOrder:
      type: object
      required:
        - odpt:station
        - odpt:index
      properties:
        odpt:station:
          type: string
          x-odpt-ref: odpt:Station
          description: 駅のID（`odpt:Station` の `owl:sameAs`）。
          example: odpt.Station:TokyoMetro.Marunouchi.Tokyo
        odpt:stationTitle:
          anyOf:
            - $ref: "#/components/schemas/MultilingualText"
            - type: "null"
          description: 駅名の多言語表記。
          example:
            ja: 東京
            en: Tokyo
        odpt:index:
          type: integer
          description: 駅の並び順を表す整数。列車は通常、進行方向に応じてこの値の小さい順か大きい順に停車する。環状線などでは同じ駅が複数回現れることがある。
          example: 1
    RailwayFare:
      type: object
      required:
        - "@context"
        - "@id"
        - "@type"
        - dc:date
        - owl:sameAs
        - odpt:operator
        - odpt:fromStation
        - odpt:toStation
        - odpt:ticketFare
      properties:
        "@context":
          type: string
          description: JSON-LDのコンテキストを定義したファイルのURL。
          example: http://vocab.odpt.org/context_odpt.jsonld
        "@id":
          type: string
          description: このデータを一意に識別するucode。
          example: urn:ucode:_00001C000000000000010000030FD7E5
        "@type":
          type: string
          description: データのクラス。常に `odpt:RailwayFare`。
          example: odpt:RailwayFare
          const: odpt:RailwayFare
        dc:date:
          type: string
          format: date-time
          description: このデータを生成した日時（ISO 8601）。
          example: 2017-01-13T15:10:00+09:00
        dct:issued:
          type:
            - string
            - "null"
          format: date
          description: この運賃が適用され始めた改定日（ISO 8601の日付）。
          example: 2017-01-13
        dct:valid:
          type:
            - string
            - "null"
          format: date-time
          description: このデータが有効な期限（ISO 8601）。
          example: 2017-01-13T15:10:00+09:00
        owl:sameAs:
          type: string
          description: このデータのID。`odpt.RailwayFare:` に続けて、出発駅の会社名・路線名・駅名、到着駅の会社名・路線名・駅名を `.` でつないだ形。
          example: odpt.RailwayFare:TokyoMetro.Marunouchi.Tokyo.TokyoMetro.Tozai.Nakano
        odpt:operator:
          type: string
          x-odpt-ref: odpt:Operator
          description: 事業者のID（`odpt:Operator` の `owl:sameAs`）。
          example: odpt.Operator:TokyoMetro
        odpt:fromStation:
          type: string
          x-odpt-ref: odpt:Station
          description: 出発駅のID（`odpt:Station` の `owl:sameAs`）。
          example: odpt.Station:TokyoMetro.Marunouchi.Tokyo
        odpt:toStation:
          type: string
          x-odpt-ref: odpt:Station
          description: 到着駅のID（`odpt:Station` の `owl:sameAs`）。
          example: odpt.Station:TokyoMetro.Tozai.Nakano
        odpt:ticketFare:
          type: integer
          description: 切符で乗車するときの大人運賃。
          example: 200
        odpt:icCardFare:
          type:
            - integer
            - "null"
          description: ICカードで乗車するときの大人運賃。
          example: 196
        odpt:childTicketFare:
          type:
            - integer
            - "null"
          description: 切符で乗車するときの子供運賃。
          example: 100
        odpt:childIcCardFare:
          type:
            - integer
            - "null"
          description: ICカードで乗車するときの子供運賃。
          example: 98
        odpt:viaStation:
          type:
            - array
            - "null"
          items:
            type: string
            x-odpt-ref: odpt:Station
          description: 運賃計算で経由する駅のID（`odpt:Station` の `owl:sameAs`）の一覧。
          example:
            - odpt.Station:TokyoMetro.Tozai.NishiFunabashi
        odpt:viaRailway:
          type:
            - array
            - "null"
          items:
            type: string
            x-odpt-ref: odpt:Railway
          description: 運賃計算で経由する路線のID（`odpt:Railway` の `owl:sameAs`）の一覧。
          example:
            - odpt.Railway:TokyoMetro.Tozai
        odpt:ticketType:
          type:
            - string
            - "null"
          x-odpt-ref: odpt:TicketType
          description: 乗車券の種別。特急やライナーのように列車の種別で料金が変わる場合に入る。
        odpt:paymentMethod:
          type:
            - array
            - "null"
          items:
            type: string
          description: 使える支払い方法の一覧。
    Station:
      type: object
      required:
        - "@context"
        - "@id"
        - "@type"
        - dc:date
        - owl:sameAs
        - odpt:operator
        - odpt:railway
      properties:
        "@context":
          type: string
          description: JSON-LDのコンテキストを定義したファイルのURL。
