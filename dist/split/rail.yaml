          example: http://vocab.odpt.org/context_odpt.jsonld
        "@id":
          type: string
          description: このデータを一意に識別するucode。
          example: urn:ucode:_00001C000000000000010000030FD7E5
        "@type":
          type: string
          description: データのクラス。常に `odpt:TrainTimetable`。
          example: odpt:TrainTimetable
          const: odpt:TrainTimetable
        dc:date:
          type: string
          format: date-time
          description: このデータを生成した日時（ISO 8601）。
          example: 2017-01-13T15:10:00+09:00
        dct:issued:
          type:
            - string
            - "null"
          format: date
          description: この時刻表が適用され始めたダイヤ改正日（ISO 8601の日付）。
          example: 2017-01-13
        dct:valid:
          type:
            - string
            - "null"
          format: date-time
          description: このデータが有効な期限（ISO 8601）。
          example: 2017-01-13T15:10:00+09:00
        owl:sameAs:
          type: string
          description: このデータのID。`odpt.TrainTimetable:会社名.路線名.列車番号.曜日種別` の形。同じIDが複数できる場合は、末尾に `.1`、`.2` のように連番が付く。
          example: odpt.TrainTimetable:JR-East.ChuoRapid.123M.Weekday
        odpt:operator:
          type: string
          x-odpt-ref: odpt:Operator
          description: 事業者のID（`odpt:Operator` の `owl:sameAs`）。
          example: odpt.Operator:JR-East
        odpt:railway:
          type: string
          x-odpt-ref: odpt:Railway
          description: 路線のID（`odpt:Railway` の `owl:sameAs`）。
          example: odpt.Railway:JR-East.Yamanote
        odpt:railDirection:
          type:
            - string
            - "null"
          x-odpt-ref: odpt:RailDirection
          description: 進行方向のID（`odpt:RailDirection` の `owl:sameAs`）。
          example: odpt.RailDirection:Outbound
        odpt:calendar:
          type:
            - string
            - "null"
          x-odpt-ref: odpt:Calendar
          description: この時刻表が適用される曜日・日付区分のID（`odpt:Calendar` の `owl:sameAs`）。
          example: odpt.Calendar:Weekday
        odpt:train:
          type:
            - string
            - "null"
          x-odpt-ref: odpt:Train
          description: 列車のID（`odpt:Train` の `owl:sameAs`）。
          example: odpt.Train:JR-East.Yamanote.123M
        odpt:trainNumber:
          type: string
          description: 列車番号。
          example: 123M
        odpt:trainType:
          type:
            - string
            - "null"
          x-odpt-ref: odpt:TrainType
          description: 列車種別のID（`odpt:TrainType` の `owl:sameAs`）。
          example: odpt.TrainType:JR-East.Local
        odpt:trainName:
          type:
            - array
            - "null"
          items:
            type: object
          description: 列車の名称や愛称の一覧（多言語表記）。
          example:
            - ja: むさし
              en: Musashi
        odpt:trainOwner:
          type:
            - string
            - "null"
          x-odpt-ref: odpt:Operator
          description: 車両を所有する事業者のID（`odpt:Operator` の `owl:sameAs`）。
          example: odpt.Operator:JR-East
        odpt:originStation:
          type:
            - array
            - "null"
          items:
            type: string
            x-odpt-ref: odpt:Station
          description: 始発駅のID（`odpt:Station` の `owl:sameAs`）の一覧。
          example:
            - odpt.Station:JR-East.ChuoRapid.Tokyo
        odpt:destinationStation:
          type:
            - array
            - "null"
          items:
            type: string
            x-odpt-ref: odpt:Station
          description: 行先（終着駅）のID（`odpt:Station` の `owl:sameAs`）の一覧。
          example:
            - odpt.Station:JR-East.ChuoRapid.Takao
        odpt:viaStation:
          type:
            - array
            - "null"
          items:
            type: string
            x-odpt-ref: odpt:Station
          description: 経由する駅のID（`odpt:Station` の `owl:sameAs`）の一覧。
          example:
            - odpt.Station:TokyoMetro.Tozai.NishiFunabashi
        odpt:viaRailway:
          type:
            - array
            - "null"
          items:
            type: string
            x-odpt-ref: odpt:Railway
          description: 経由する路線のID（`odpt:Railway` の `owl:sameAs`）の一覧。
          example:
            - odpt.Railway:TokyoMetro.Tozai
        odpt:previousTrainTimetable:
          type:
            - array
            - "null"
          items:
            type: string
            x-odpt-ref: odpt:TrainTimetable
          description: 1本の列車の時刻表が複数のデータに分かれているとき、1つ前の部分のID（`odpt:TrainTimetable` の `owl:sameAs`）の一覧。
          example:
            - odpt.TrainTimetable:JR-East.ChuoRapid.123M.Weekday
        odpt:nextTrainTimetable:
          type:
            - array
            - "null"
          items:
            type: string
            x-odpt-ref: odpt:TrainTimetable
          description: 1本の列車の時刻表が複数のデータに分かれているとき、1つ後の部分のID（`odpt:TrainTimetable` の `owl:sameAs`）の一覧。
          example:
            - odpt.TrainTimetable:JR-East.ChuoRapid.123M.Weekday
        odpt:trainTimetableObject:
          type: array
          items:
            $ref: "#/components/schemas/TrainTimetableObject"
          description: 停車駅ごとの時刻の一覧。各要素は出発駅と出発時刻、または到着駅と到着時刻を持つ。
          example:
            - odpt:departureTime: 06:00
              odpt:departureStation: odpt.Station:JR-East.ChuoRapid.Tokyo
            - odpt:arrivalTime: 07:00
              odpt:arrivalStation: odpt.Station:JR-East.ChuoRapid.Takao
        odpt:needExtraFee:
          type:
            - boolean
            - "null"
          description: 乗車券のほかに料金がかかるなら true。
          example: true
        odpt:note:
          anyOf:
            - $ref: "#/components/schemas/MultilingualText"
            - type: "null"
          description: ほかのプロパティで表せない補足事項の文章（多言語表記）。
          example:
            ja: 日本語での注釈情報
            en: Note in English
    TrainTimetableObject:
      type: object
      properties:
        odpt:arrivalTime:
          anyOf:
            - $ref: "#/components/schemas/Time"
            - type: "null"
          description: 到着時刻。発車時刻と違う場合に入ることがある。
          example: 05:08
        odpt:arrivalStation:
          type:
            - string
            - "null"
          x-odpt-ref: odpt:Station
          description: 到着駅のID（`odpt:Station` の `owl:sameAs`）。
          example: odpt.Station:JR-East.ChuoRapid.Tokyo
        odpt:departureTime:
          anyOf:
            - $ref: "#/components/schemas/Time"
            - type: "null"
          description: 出発時刻。
          example: 05:09
        odpt:departureStation:
          type:
            - string
            - "null"
          x-odpt-ref: odpt:Station
          description: 出発駅のID（`odpt:Station` の `owl:sameAs`）。
          example: odpt.Station:JR-East.ChuoRapid.Tokyo
        odpt:platformNumber:
          type:
            - string
            - "null"
          description: 列車が到着するホームの番号。
          example: "1"
        odpt:platformName:
          anyOf:
            - $ref: "#/components/schemas/MultilingualText"
            - type: "null"
          description: 列車が発着するホームの名前（多言語表記）。
          example:
            ja: 日本語名称
            en: English Name
        odpt:note:
          anyOf:
            - $ref: "#/components/schemas/MultilingualText"
            - type: "null"
          description: ほかのプロパティで表せない補足事項の文章（多言語表記）。
          example:
            ja: 日本語での注釈情報
            en: Note in English
    TrainType:
      type: object
      required:
        - "@context"
        - "@id"
        - "@type"
        - owl:sameAs
        - odpt:operator
      properties:
        "@context":
          type: string
          description: JSON-LDのコンテキストを定義したファイルのURL。
          example: http://vocab.odpt.org/context_odpt.jsonld
        "@id":
          type: string
          description: このデータを一意に識別するucode。
          example: urn:ucode:_00001C000000000000010000030FD7E5
        "@type":
          type: string
          description: データのクラス。常に `odpt:TrainType`。
          example: odpt:TrainType
          const: odpt:TrainType
        dc:date:
          type:
            - string
            - "null"
          format: date-time
          description: このデータを生成した日時（ISO 8601）。
          example: 2017-01-13T15:10:00+09:00
        owl:sameAs:
          type: string
          description: このデータのID。`odpt.TrainType:会社名.列車種別` の形。
          example: odpt:JR-East.Local
        odpt:operator:
          type: string
          x-odpt-ref: odpt:Operator
          description: 事業者のID（`odpt:Operator` の `owl:sameAs`）。
          example: odpt.Operator:JR-East
        dc:title:
          type:
            - string
            - "null"
          description: 日本語の列車種別名。
          example: 普通
        odpt:trainTypeTitle:
          anyOf:
            - $ref: "#/components/schemas/MultilingualText"
            - type: "null"
          description: 列車種別名の多言語表記。
          example:
            ja: 普通
            en: Local
  responses:
    BadRequest:
      description: パラメータが正しくありません。
    Unauthorized:
      description: "`acl:consumerKey` が正しくありません。仕様書ではこの場合は401とされていますが、実際のAPIは403を返します（2026年9月29日に確認）。"
    Forbidden:
      description: "`acl:consumerKey` がないか正しくない、またはこのデータを取得する権限がありません。"
    NotFound:
      description: 該当するデータがありません。
    MethodNotAllowed:
      description: このHTTPメソッドは使えません。
    InternalServerError:
      description: サーバー内部でエラーが発生しました。
    ServiceUnavailable:
      description: サービスを利用できません。
