  /places/odpt:Station:
    get:
      operationId: searchStationByLocation
      tags:
        - 地物検索
      summary: 指定した範囲にある odpt:Station を検索
      parameters:
        - name: lat
          in: query
          required: true
          description: 範囲の中心の緯度（WGS84、10進数）。
          schema:
            type: number
          example: 35.681265
        - name: lon
          in: query
          required: true
          description: 範囲の中心の経度（WGS84、10進数）。
          schema:
            type: number
          example: 139.766926
        - name: radius
          in: query
          required: true
          description: 範囲の半径（メートル）。
          schema:
            type: number
            minimum: 0
            maximum: 4000
          example: 1000
        - name: "@id"
          in: query
          description: データの `@id` で絞り込む。
          schema:
            type: string
        - name: owl:sameAs
          in: query
          description: データの `owl:sameAs` で絞り込む。
          schema:
            type: string
        - name: dc:title
          in: query
          description: 日本語の駅名で絞り込む（例：新宿）。
          schema:
            type: string
        - name: odpt:operator
          in: query
          description: 事業者のID（`odpt:Operator` の `owl:sameAs`）で絞り込む。
          schema:
            type: string
            x-odpt-ref: odpt:Operator
        - name: odpt:railway
          in: query
          description: 駅がある路線のID（`odpt:Railway` の `owl:sameAs`）で絞り込む。
          schema:
            type: string
            x-odpt-ref: odpt:Railway
        - name: odpt:stationCode
          in: query
          description: 駅番号で絞り込む（例：`OH01`）。
          schema:
            type: string
      responses:
        "200":
          description: 範囲内で条件に一致したデータの配列。一致するデータがなければ空の配列。
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Station"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /places/odpt:BusstopPole:
    get:
      operationId: searchBusstopPoleByLocation
      tags:
        - 地物検索
      summary: 指定した範囲にある odpt:BusstopPole を検索
      parameters:
        - name: lat
          in: query
          required: true
          description: 範囲の中心の緯度（WGS84、10進数）。
          schema:
            type: number
          example: 35.681265
        - name: lon
          in: query
          required: true
          description: 範囲の中心の経度（WGS84、10進数）。
          schema:
            type: number
          example: 139.766926
        - name: radius
          in: query
          required: true
          description: 範囲の半径（メートル）。
          schema:
            type: number
            minimum: 0
            maximum: 4000
          example: 1000
        - name: "@id"
          in: query
          description: データの `@id` で絞り込む。
          schema:
            type: string
        - name: owl:sameAs
          in: query
          description: データの `owl:sameAs` で絞り込む。
          schema:
            type: string
        - name: dc:title
          in: query
          description: バス停名で絞り込む。
          schema:
            type: string
        - name: odpt:busstopPoleNumber
          in: query
          description: 標柱番号で絞り込む。
          schema:
            type: string
        - name: odpt:platformNumber
          in: query
          description: のりば番号。
          schema:
            type: string
        - name: odpt:busroutePattern
          in: query
          description: この標柱に停まる系統のID（`odpt:BusroutePattern` の `owl:sameAs`）で絞り込む。
          schema:
            type: string
            x-odpt-ref: odpt:BusroutePattern
        - name: odpt:operator
          in: query
          description: 事業者のID（`odpt:Operator` の `owl:sameAs`）で絞り込む。
          schema:
            type: string
            x-odpt-ref: odpt:Operator
      responses:
        "200":
          description: 範囲内で条件に一致したデータの配列。一致するデータがなければ空の配列。
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BusstopPole"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /datapoints/{id}:
    get:
      operationId: getDatapoint
      tags:
        - その他
      summary: IDを指定してデータを1件取得
      description: データダンプAPIが対応するクラスのデータを取得できます。
      parameters:
        - name: id
          in: path
          required: true
          description: 取得するデータの `@id`（`urn:ucode:_` で始まるucode）または `owl:sameAs` の値。
          schema:
            type: string
          examples:
            ucode:
              value: urn:ucode:_00001C000000000000010000030517CE
            sameAs:
              value: odpt.Station:TokyoMetro.Ginza.Ueno
      responses:
        "200":
          description: 指定したIDのデータ。
          content:
            application/json:
              schema:
                type: array
                items:
                  description: "`@type` の値に対応するクラスのデータ。"
                  oneOf:
                    - $ref: "#/components/schemas/Calendar"
                    - $ref: "#/components/schemas/Operator"
                    - $ref: "#/components/schemas/Station"
                    - $ref: "#/components/schemas/StationTimetable"
                    - $ref: "#/components/schemas/TrainTimetable"
                    - $ref: "#/components/schemas/TrainType"
                    - $ref: "#/components/schemas/RailDirection"
                    - $ref: "#/components/schemas/Railway"
                    - $ref: "#/components/schemas/RailwayFare"
                    - $ref: "#/components/schemas/PassengerSurvey"
                    - $ref: "#/components/schemas/BusTimetable"
                    - $ref: "#/components/schemas/BusroutePattern"
                    - $ref: "#/components/schemas/BusroutePatternFare"
                    - $ref: "#/components/schemas/BusstopPole"
                    - $ref: "#/components/schemas/BusstopPoleTimetable"
                    - $ref: "#/components/schemas/Airport"
                    - $ref: "#/components/schemas/AirportTerminal"
                    - $ref: "#/components/schemas/FlightSchedule"
                    - $ref: "#/components/schemas/FlightStatus"
                  discriminator:
                    propertyName: "@type"
                    mapping:
                      odpt:Calendar: "#/components/schemas/Calendar"
                      odpt:Operator: "#/components/schemas/Operator"
                      odpt:Station: "#/components/schemas/Station"
                      odpt:StationTimetable: "#/components/schemas/StationTimetable"
                      odpt:TrainTimetable: "#/components/schemas/TrainTimetable"
                      odpt:TrainType: "#/components/schemas/TrainType"
                      odpt:RailDirection: "#/components/schemas/RailDirection"
                      odpt:Railway: "#/components/schemas/Railway"
                      odpt:RailwayFare: "#/components/schemas/RailwayFare"
                      odpt:PassengerSurvey: "#/components/schemas/PassengerSurvey"
                      odpt:BusTimetable: "#/components/schemas/BusTimetable"
                      odpt:BusroutePattern: "#/components/schemas/BusroutePattern"
                      odpt:BusroutePatternFare: "#/components/schemas/BusroutePatternFare"
                      odpt:BusstopPole: "#/components/schemas/BusstopPole"
                      odpt:BusstopPoleTimetable: "#/components/schemas/BusstopPoleTimetable"
                      odpt:Airport: "#/components/schemas/Airport"
                      odpt:AirportTerminal: "#/components/schemas/AirportTerminal"
                      odpt:FlightSchedule: "#/components/schemas/FlightSchedule"
                      odpt:FlightStatus: "#/components/schemas/FlightStatus"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          description: このデータの取得には課金が必要です。
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /files/{path}:
    get:
      operationId: getFile
      tags:
        - その他
      summary: 事業者が提供するファイルを取得
      description: |
        GTFSなど、事業者が提供するファイルを取得します。レスポンスはファイルの保存先URLへの302リダイレクトです。
        仕様書では `path` をクエリパラメータとしていますが、実際のAPIはパスの末尾にファイルのパスをつなげる形式です（2026年9月29日に確認）。
      parameters:
        - name: path
          in: path
          required: true
          description: 取得するファイルのパス。`/` を含み、`%2F` にエンコードしても受け付けられます。
          schema:
            type: string
          example: Toei/data/ToeiBus-GTFS.zip
      responses:
        "200":
          description: リダイレクト先から取得したファイル。
          content:
            application/octet-stream:
              schema:
                type: string
                contentMediaType: application/octet-stream
        "302":
          description: ファイルの保存先URLへのリダイレクト。
          headers:
            Location:
              description: ファイルの保存先URL。
              schema:
                type: string
                format: uri
        "403":
          description: "`acl:consumerKey` がないか、このファイルを取得する権限がありません。"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  securitySchemes:
    consumerKey:
      type: apiKey
      in: query
      name: acl:consumerKey
      description: ODPT開発者サイトで発行されるアクセストークン。
  schemas:
    MultilingualText:
      type: object
      description: 言語タグ（`ja`、`en`、`ja-Hrkt` など）をキー、その言語の表記を値とするオブジェクト。
      additionalProperties:
        type: string
      example:
        ja: 東京
        en: Tokyo
    Time:
      type: string
      description: "`H:MM` または `HH:MM` 形式の時刻。バスの時刻表では時が1桁のことがある。"
      pattern: ^\d{1,2}:\d{2}$
      example: 05:09
    GeoJSON:
      type: object
      description: GeoJSON形式の地物情報。
      required:
        - type
      properties:
        type:
          type: string
        coordinates:
          type: array
      additionalProperties: true
    Calendar:
      type: object
      required:
        - "@context"
        - "@id"
        - "@type"
        - owl:sameAs
      properties:
        "@context":
          type: string
          description: JSON-LDのコンテキストを定義したファイルのURL。
          example: http://vocab.odpt.org/context_odpt.jsonld
        "@id":
          type: string
          description: このデータを一意に識別するucode。
          example: urn:ucode:_00001C000000000000010000030FD7E5
        "@type":
          type: string
          description: データのクラス。常に `odpt:Calendar`。
          example: odpt:Calendar
          const: odpt:Calendar
        dc:date:
          type:
            - string
            - "null"
          format: date-time
          description: このデータを生成した日時（ISO 8601）。
          example: 2017-01-13T15:10:00+09:00
        owl:sameAs:
          type: string
          description: このデータのID。`odpt.Calendar:名称` の形で、期間があれば `.期間` が続く。
          example: odpt.Calendar:Weekday
        dc:title:
          type:
            - string
            - "null"
          description: 日本語の曜日・日付区分名（平日、休日、市場休日など）。
          example: 平日
        odpt:calendarTitle:
          anyOf:
            - $ref: "#/components/schemas/MultilingualText"
            - type: "null"
          description: 曜日・日付区分名の多言語表記。
          example:
            ja: 平日
            en: Weekday
        odpt:day:
          type:
            - array
            - "null"
          items:
            type: string
            format: date
          description: この区分に当てはまる日付の一覧（ISO 8601の日付）。
          example:
            - 2017-01-13
            - 2017-01-18
        odpt:duration:
          type:
            - string
            - "null"
          description: この区分が有効な期間（ISO 8601の期間）。
          example: 2017-11-13/2017-11-18
        odpt:operator:
          type:
            - string
            - "null"
          x-odpt-ref: odpt:Operator
          description: この曜日・日付区分を定めた事業者のID（`odpt:Operator` の `owl:sameAs`）。
    Operator:
      type: object
      required:
        - "@context"
        - "@id"
        - "@type"
        - owl:sameAs
      properties:
        "@context":
          type: string
          description: JSON-LDのコンテキストを定義したファイルのURL。
          example: http://vocab.odpt.org/context_odpt.jsonld
        "@id":
          type: string
          description: このデータを一意に識別するucode。
          example: urn:ucode:_00001C000000000000010000030FD7E5
        "@type":
          type: string
          description: データのクラス。常に `odpt:Operator`。
          example: odpt:Operator
          const: odpt:Operator
        dc:date:
          type:
            - string
            - "null"
          format: date-time
          description: このデータを生成した日時（ISO 8601）。
          example: 2017-01-13T15:10:00+09:00
        owl:sameAs:
          type: string
          description: このデータのID。`odpt.Operator:名称` の形。
          example: odpt.Operator:XX
        dc:title:
          type:
            - string
            - "null"
          description: 日本語の事業者名。
          example: ○○電鉄
        odpt:operatorTitle:
          anyOf:
            - $ref: "#/components/schemas/MultilingualText"
            - type: "null"
          description: 事業者名の多言語表記。
          example:
            ja: ○○電鉄
            en: XX Railway
    PassengerSurvey:
      type: object
      required:
        - "@context"
        - "@id"
        - "@type"
        - dc:date
        - owl:sameAs
        - odpt:operator
        - odpt:station
        - odpt:railway
        - odpt:includeAlighting
        - odpt:passengerSurveyObject
      properties:
        "@context":
          type: string
          description: JSON-LDのコンテキストを定義したファイルのURL。
          example: http://vocab.odpt.org/context_odpt.jsonld
        "@id":
          type: string
          description: このデータを一意に識別するucode。
          example: urn:ucode:_00001C000000000000010000030FD7E5
        "@type":
          type: string
          description: データのクラス。常に `odpt:PassengerSurvey`。
          example: odpt:PassengerSurvey
          const: odpt:PassengerSurvey
        dc:date:
          type: string
          format: date-time
          description: このデータを生成した日時（ISO 8601）。
          example: 2017-01-13T15:10:00+09:00
        owl:sameAs:
          type: string
          description: このデータのID。`odpt.PassengerSurvey:会社名.駅名` か `odpt.PassengerSurvey:会社名.路線名.駅名` の形。
          example: odpt.PassengerSurvey:JR-East.Tokyo
        odpt:operator:
          type: string
          x-odpt-ref: odpt:Operator
          description: 事業者のID（`odpt:Operator` の `owl:sameAs`）。
          example: odpt.Operator:JR-East
        odpt:station:
          type: array
          items:
            type: string
            x-odpt-ref: odpt:Station
          description: 対象の駅のID（`odpt:Station` の `owl:sameAs`）の一覧。
          example:
            - odpt.Station:JR-East.Yamanote.Tokyo
            - odpt.Station:JR-East.ChuoRapid.Tokyo
        odpt:railway:
          type: array
          items:
            type: string
            x-odpt-ref: odpt:Railway
          description: 対象の路線のID（`odpt:Railway` の `owl:sameAs`）の一覧。
          example:
            - odpt.Railway:JR-East.Yamanote
            - odpt.Railway:JR-East.ChuoRapid
        odpt:includeAlighting:
          type: boolean
          description: 人数が降車を含む乗降人員なら true、乗車人員だけなら false。
          example: true
        odpt:passengerSurveyObject:
          type: array
          items:
            $ref: "#/components/schemas/PassengerSurveyObject"
          description: 調査年度ごとの人数の一覧。
          example:
            - odpt:surveyYear: 2017
              odpt:passengerJourneys: 12345
    PassengerSurveyObject:
      type: object
      required:
        - odpt:surveyYear
        - odpt:passengerJourneys
      properties:
        odpt:surveyYear:
          type: integer
          description: 調査した年度。
          example: 2017
        odpt:passengerJourneys:
          type: integer
          description: 1日平均の乗降人員数。`odpt:includeAlighting` が false のときは乗車人員数。
          example: 12345
    RailDirection:
      type: object
      required:
        - "@context"
        - "@id"
        - "@type"
        - owl:sameAs
      properties:
        "@context":
          type: string
          description: JSON-LDのコンテキストを定義したファイルのURL。
          example: http://vocab.odpt.org/context_odpt.jsonld
        "@id":
          type: string
          description: このデータを一意に識別するucode。
          example: urn:ucode:_00001C000000000000010000030FD7E5
        "@type":
          type: string
          description: データのクラス。常に `odpt:RailDirection`。
          example: odpt:RailDirection
          const: odpt:RailDirection
        dc:date:
          type:
            - string
            - "null"
          format: date-time
          description: このデータを生成した日時（ISO 8601）。
          example: 2017-01-13T15:10:00+09:00
        owl:sameAs:
          type: string
          description: このデータのID。`odpt.RailDirection:進行方向` か `odpt.RailDirection:会社名.進行方向` の形。
          example: odpt.RailDirection:Inbound
        dc:title:
          type:
            - string
            - "null"
          description: 日本語の進行方向名。
          example: 上り
        odpt:railDirectionTitle:
          anyOf:
            - $ref: "#/components/schemas/MultilingualText"
            - type: "null"
          description: 進行方向名の多言語表記。
          example:
            ja: 上り
            en: Inbound
        odpt:operator:
          type:
            - string
            - "null"
          x-odpt-ref: odpt:Operator
          description: この進行方向を定めた事業者のID（`odpt:Operator` の `owl:sameAs`）。
    Railway:
      type: object
      required:
        - "@context"
        - "@id"
        - "@type"
        - dc:date
        - owl:sameAs
        - dc:title
        - odpt:operator
        - odpt:stationOrder
      properties:
        "@context":
          type: string
          description: JSON-LDのコンテキストを定義したファイルのURL。
          example: http://vocab.odpt.org/context_odpt.jsonld
        "@id":
          type: string
          description: このデータを一意に識別するucode。
          example: urn:ucode:_00001C000000000000010000030FD7E5
        "@type":
          type: string
          description: データのクラス。常に `odpt:Railway`。
          example: odpt:Railway
          const: odpt:Railway
        dc:date:
          type: string
          format: date-time
          description: このデータを生成した日時（ISO 8601）。
          example: 2017-01-13T15:10:00+09:00
        owl:sameAs:
          type: string
          description: このデータのID。`odpt.Railway:会社名.路線名` の形。
          example: odpt.Railway:JR-East.Yamanote
        dc:title:
          type: string
          description: 日本語の路線名。
          example: 山手線
        odpt:railwayTitle:
          anyOf:
            - $ref: "#/components/schemas/MultilingualText"
            - type: "null"
          description: 路線名の多言語表記。
          example:
            ja: 山手線
            en: Yamanote Line
        odpt:kana:
          type:
            - string
            - "null"
          description: 路線名の読み（ひらがな）。
        odpt:operator:
          type: string
          x-odpt-ref: odpt:Operator
          description: 事業者のID（`odpt:Operator` の `owl:sameAs`）。
          example: odpt.Operator:JR-East
        odpt:lineCode:
          type:
            - string
            - "null"
          description: 路線記号（丸ノ内線なら `M`）。
          example: M
        odpt:color:
          type:
            - string
            - "null"
          description: 路線の色。`#RRGGBB`（16進）、`DICnnn`（DIC）、`PANTONExxxx`（PANTONE）のいずれかの形式。
        ug:region:
          anyOf:
            - $ref: "#/components/schemas/GeoJSON"
            - type: "null"
          description: 地物の形状（GeoJSON）。
        odpt:ascendingRailDirection:
          type:
            - string
            - "null"
          x-odpt-ref: odpt:RailDirection
          description: "`odpt:stationOrder` の `odpt:index` が増える向きの進行方向のID（`odpt:RailDirection` の `owl:sameAs`）。"
          example: odpt.RailDirection:Outbound
        odpt:descendingRailDirection:
          type:
            - string
            - "null"
          x-odpt-ref: odpt:RailDirection
          description: "`odpt:stationOrder` の `odpt:index` が減る向きの進行方向のID（`odpt:RailDirection` の `owl:sameAs`）。"
          example: odpt.RailDirection:Inbound
        odpt:stationOrder:
          type: array
          items:
            $ref: "#/components/schemas/StationOrder"
          description: 路線上の駅を並び順に並べた一覧。
          example:
            - odpt:index: 1
              odpt:station: odpt.Station:JR-East.ChuoRapid.Tokyo
    StationOrder:
      type: object
      required:
        - odpt:station
        - odpt:index
      properties:
        odpt:station:
          type: string
          x-odpt-ref: odpt:Station
          description: 駅のID（`odpt:Station` の `owl:sameAs`）。
          example: odpt.Station:TokyoMetro.Marunouchi.Tokyo
        odpt:stationTitle:
          anyOf:
            - $ref: "#/components/schemas/MultilingualText"
            - type: "null"
          description: 駅名の多言語表記。
          example:
            ja: 東京
            en: Tokyo
        odpt:index:
          type: integer
          description: 駅の並び順を表す整数。列車は通常、進行方向に応じてこの値の小さい順か大きい順に停車する。環状線などでは同じ駅が複数回現れることがある。
          example: 1
    RailwayFare:
      type: object
      required:
        - "@context"
        - "@id"
        - "@type"
        - dc:date
        - owl:sameAs
        - odpt:operator
        - odpt:fromStation
        - odpt:toStation
        - odpt:ticketFare
      properties:
        "@context":
          type: string
          description: JSON-LDのコンテキストを定義したファイルのURL。
          example: http://vocab.odpt.org/context_odpt.jsonld
        "@id":
          type: string
          description: このデータを一意に識別するucode。
          example: urn:ucode:_00001C000000000000010000030FD7E5
        "@type":
          type: string
          description: データのクラス。常に `odpt:RailwayFare`。
          example: odpt:RailwayFare
          const: odpt:RailwayFare
        dc:date:
          type: string
          format: date-time
          description: このデータを生成した日時（ISO 8601）。
          example: 2017-01-13T15:10:00+09:00
        dct:issued:
          type:
            - string
            - "null"
          format: date
          description: この運賃が適用され始めた改定日（ISO 8601の日付）。
          example: 2017-01-13
        dct:valid:
          type:
            - string
            - "null"
          format: date-time
          description: このデータが有効な期限（ISO 8601）。
          example: 2017-01-13T15:10:00+09:00
        owl:sameAs:
          type: string
          description: このデータのID。`odpt.RailwayFare:` に続けて、出発駅の会社名・路線名・駅名、到着駅の会社名・路線名・駅名を `.` でつないだ形。
          example: odpt.RailwayFare:TokyoMetro.Marunouchi.Tokyo.TokyoMetro.Tozai.Nakano
        odpt:operator:
