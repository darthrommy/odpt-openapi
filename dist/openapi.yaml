          type:
            - string
            - "null"
          x-odpt-ref: odpt:BusstopPole
          description: バスが停車中のバス停、または最後に通過したバス停のID（`odpt:BusstopPole` の `owl:sameAs`）。
        odpt:fromBusstopPoleTime:
          type:
            - string
            - "null"
