          description: 最後に通過したバス停を出た時刻。`odpt:fromBusstopPole` が null ならこの値も null。
          example: 2017-01-13T15:10:00+09:00
        odpt:toBusstopPole:
          type:
            - string
            - "null"
          x-odpt-ref: odpt:BusstopPole
          description: バスが次に着くバス停のID（`odpt:BusstopPole` の `owl:sameAs`）。
        odpt:progress:
          type:
            - number
            - "null"
          format: double
          description: "`odpt:fromBusstopPole` を0、`odpt:toBusstopPole` を1としたときの現在位置の割合。"
          example: 0
        geo:long:
          type:
            - number
            - "null"
          format: double
