openapi: 3.1.0
info:
  title: ODPT API（非公式定義）
  version: 4.16.0
  license:
    name: CC0 1.0 Universal
    identifier: CC0-1.0
  description: |
    公共交通オープンデータセンター（ODPT）のAPIについて、公開されているAPI仕様書（第4.16版）をもとに第三者が作成した非公式のOpenAPI定義です。
    ODPTおよび公共交通オープンデータ協議会が提供・保証するものではありません。正確な仕様は公式の仕様書で確認してください。

    ## 検索結果の形式
    検索系のAPIは、条件に一致したデータをJSON-LDのオブジェクトの配列で返します。一致するデータがなければ空の配列を返します。
    件数がシステムの上限を超えると、上限以下に切り詰めた結果が返るため、条件を追加して取り直してください。
    上限は多くのクラスで1,000件、`odpt:BusstopPole` で10,000件でした（2026年9月29日に確認）。

    ## 値がない場合
    任意のプロパティは、値がないときにプロパティ自体が省かれる場合と、`null` が入る場合があります。このため、任意のプロパティはすべて `null` も許す定義にしています。

    ## 絞り込み条件の指定
    各パスに列挙したクエリパラメータのほかに、そのクラスのプロパティ名をクエリパラメータに使って絞り込めます。
    - 値が文字列か数値のプロパティは、プロパティ名をそのまま指定します（例：`dc:title=東京`）。
    - 値が文字列か数値の配列のプロパティは、指定した値を要素に含むデータが一致します。
    - 値がオブジェクトのプロパティは、`プロパティ名.キー` の形でキーを指定します（例：`odpt:stationTitle.en=Tokyo`）。`キーA.キーB` のように入れ子にもできます。
    - 要素がオブジェクトの配列のプロパティは、条件に使えません。

    値をコンマで区切ると、いずれかに一致するデータを返します（例：`dc:title=東京,五反田`）。区切って指定できる値の数には上限があり、超えるとエラーになります。
    パラメータの値はURLエンコードして送信してください。

    ## エンドポイント
    データセットによってはエンドポイントが `https://api.odpt.org/api/v4` と異なります。利用するデータセットの案内を確認してください。
servers:
  - url: https://api.odpt.org/api/v4
    description: 通常のAPI。
  - url: https://api-challenge.odpt.org/api/v4
    description: 公共交通オープンデータチャレンジの参加者向けAPI。参加者に発行されるキーでだけ利用でき、提供されるデータも通常のAPIと異なる。
security:
  - consumerKey: []
tags:
  - name: 共通
    description: 曜日・日付区分と事業者。
  - name: 鉄道
    description: 路線、駅、時刻表、運賃、列車の位置、運行情報など。
  - name: バス
    description: 系統、バス停、時刻表、運賃、バスの位置など。
  - name: 航空
    description: 空港、ターミナル、時刻表、発着便の情報など。
  - name: データダンプ
    description: 指定したクラスの全データを返します。レスポンスはダンプファイルのURLへの302リダイレクトです（仕様書では301）。
  - name: 地物検索
    description: 緯度・経度と半径で指定した円の範囲にあるデータを返します。
  - name: その他
    description: IDを指定した取得と、事業者が提供するファイルの取得。
paths:
  /odpt:Calendar:
    get:
      operationId: searchCalendar
      tags:
        - 共通
      summary: 曜日・日付区分を検索
      parameters:
        - name: "@id"
          in: query
          description: データの `@id` で絞り込む。
          schema:
            type: string
        - name: owl:sameAs
          in: query
          description: データの `owl:sameAs` で絞り込む。
          schema:
            type: string
      responses:
        "200":
          description: 条件に一致したデータの配列。一致するデータがなければ空の配列。
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Calendar"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /odpt:Operator:
    get:
      operationId: searchOperator
      tags:
        - 共通
      summary: 事業者を検索
      parameters:
        - name: "@id"
          in: query
          description: データの `@id` で絞り込む。
          schema:
            type: string
        - name: owl:sameAs
          in: query
          description: データの `owl:sameAs` で絞り込む。
          schema:
            type: string
      responses:
        "200":
          description: 条件に一致したデータの配列。一致するデータがなければ空の配列。
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Operator"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /odpt:PassengerSurvey:
    get:
      operationId: searchPassengerSurvey
      tags:
        - 鉄道
      summary: 駅別の乗降人員を検索
      parameters:
        - name: "@id"
          in: query
          description: データの `@id` で絞り込む。
          schema:
            type: string
        - name: owl:sameAs
          in: query
          description: データの `owl:sameAs` で絞り込む。
          schema:
            type: string
        - name: odpt:operator
          in: query
          description: 事業者のID（`odpt:Operator` の `owl:sameAs`）で絞り込む。
          schema:
            type: string
            x-odpt-ref: odpt:Operator
        - name: odpt:station
          in: query
          description: 駅のID（`odpt:Station` の `owl:sameAs`）。
          schema:
            type: string
            x-odpt-ref: odpt:Station
        - name: odpt:railway
          in: query
          description: 路線のID（`odpt:Railway` の `owl:sameAs`）。
          schema:
            type: string
            x-odpt-ref: odpt:Railway
      responses:
        "200":
          description: 条件に一致したデータの配列。一致するデータがなければ空の配列。
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PassengerSurvey"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /odpt:RailDirection:
    get:
      operationId: searchRailDirection
      tags:
        - 鉄道
      summary: 進行方向を検索
      parameters:
        - name: "@id"
          in: query
          description: データの `@id` で絞り込む。
          schema:
            type: string
        - name: owl:sameAs
          in: query
          description: データの `owl:sameAs` で絞り込む。
          schema:
            type: string
      responses:
        "200":
          description: 条件に一致したデータの配列。一致するデータがなければ空の配列。
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RailDirection"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /odpt:Railway:
    get:
      operationId: searchRailway
      tags:
        - 鉄道
      summary: 路線を検索
      parameters:
        - name: "@id"
          in: query
          description: データの `@id` で絞り込む。
          schema:
            type: string
        - name: owl:sameAs
          in: query
          description: データの `owl:sameAs` で絞り込む。
          schema:
            type: string
        - name: dc:title
          in: query
          description: 日本語の路線名で絞り込む（例：京王線）。
          schema:
            type: string
        - name: odpt:operator
          in: query
          description: 事業者のID（`odpt:Operator` の `owl:sameAs`）で絞り込む。
          schema:
            type: string
            x-odpt-ref: odpt:Operator
        - name: odpt:lineCode
          in: query
          description: 路線記号で絞り込む（例：丸ノ内線は `M`）。
          schema:
            type: string
      responses:
        "200":
          description: 条件に一致したデータの配列。一致するデータがなければ空の配列。
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Railway"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /odpt:RailwayFare:
    get:
      operationId: searchRailwayFare
      tags:
        - 鉄道
      summary: 2駅間の運賃を検索
      parameters:
        - name: "@id"
          in: query
          description: データの `@id` で絞り込む。
          schema:
            type: string
        - name: owl:sameAs
          in: query
          description: データの `owl:sameAs` で絞り込む。
          schema:
            type: string
        - name: odpt:operator
          in: query
          description: 事業者のID（`odpt:Operator` の `owl:sameAs`）で絞り込む。
          schema:
            type: string
            x-odpt-ref: odpt:Operator
        - name: odpt:fromStation
          in: query
          description: 出発駅のID（`odpt:Station` の `owl:sameAs`）。
          schema:
            type: string
            x-odpt-ref: odpt:Station
        - name: odpt:toStation
          in: query
          description: 到着駅のID（`odpt:Station` の `owl:sameAs`）。
          schema:
            type: string
            x-odpt-ref: odpt:Station
      responses:
        "200":
          description: 条件に一致したデータの配列。一致するデータがなければ空の配列。
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RailwayFare"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /odpt:Station:
    get:
      operationId: searchStation
      tags:
        - 鉄道
      summary: 駅を検索
      parameters:
        - name: "@id"
          in: query
          description: データの `@id` で絞り込む。
          schema:
            type: string
        - name: owl:sameAs
          in: query
          description: データの `owl:sameAs` で絞り込む。
          schema:
            type: string
        - name: dc:title
          in: query
          description: 日本語の駅名で絞り込む（例：新宿）。
          schema:
            type: string
        - name: odpt:operator
          in: query
          description: 事業者のID（`odpt:Operator` の `owl:sameAs`）で絞り込む。
          schema:
            type: string
            x-odpt-ref: odpt:Operator
        - name: odpt:railway
          in: query
          description: 駅がある路線のID（`odpt:Railway` の `owl:sameAs`）で絞り込む。
          schema:
            type: string
            x-odpt-ref: odpt:Railway
        - name: odpt:stationCode
          in: query
          description: 駅番号で絞り込む（例：`OH01`）。
          schema:
            type: string
      responses:
        "200":
          description: 条件に一致したデータの配列。一致するデータがなければ空の配列。
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Station"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /odpt:StationTimetable:
    get:
      operationId: searchStationTimetable
      tags:
        - 鉄道
      summary: 駅時刻表を検索
      parameters:
        - name: "@id"
          in: query
          description: データの `@id` で絞り込む。
          schema:
            type: string
        - name: owl:sameAs
          in: query
          description: データの `owl:sameAs` で絞り込む。
          schema:
            type: string
        - name: odpt:station
          in: query
          description: 駅のID（`odpt:Station` の `owl:sameAs`）で絞り込む。
          schema:
            type: string
            x-odpt-ref: odpt:Station
        - name: odpt:railway
          in: query
          description: 路線のID（`odpt:Railway` の `owl:sameAs`）で絞り込む。
          schema:
            type: string
            x-odpt-ref: odpt:Railway
        - name: odpt:operator
          in: query
          description: 事業者のID（`odpt:Operator` の `owl:sameAs`）で絞り込む。
          schema:
            type: string
            x-odpt-ref: odpt:Operator
        - name: odpt:railDirection
          in: query
          description: 進行方向のID（`odpt:RailDirection` の `owl:sameAs`）で絞り込む。
          schema:
            type: string
            x-odpt-ref: odpt:RailDirection
        - name: odpt:calendar
          in: query
          description: 曜日・日付区分のID（`odpt:Calendar` の `owl:sameAs`）で絞り込む。
          schema:
            type: string
            x-odpt-ref: odpt:Calendar
        - name: dc:date
          in: query
          description: 指定した日付に使われる時刻表に絞り込む。
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: 条件に一致したデータの配列。一致するデータがなければ空の配列。
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StationTimetable"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /odpt:Train:
